name: Aktualizace volných kurtů

on:
  schedule:
    - cron: "7,22,37,52 5-21 * * *"   # záloha; hlavní spouštění je z cron-job.org
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TZ: Europe/Prague
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests tzdata pillow
      - run: python badminton_brno.py --export site    # ikony z icon.png vyrobí skript sám
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
