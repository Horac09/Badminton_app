name: Aktualizace volných kurtů

on:
  schedule:
    - cron: "*/15 5-21 * * *"   # každých 15 min, cca 6:00–23:00 našeho času (cron je v UTC)
  workflow_dispatch:             # ruční spuštění (Run workflow)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TZ: Europe/Prague
    steps:
      - uses: actions/checkout@v5          # Node 24
      - uses: actions/setup-python@v6      # Node 24
        with:
          python-version: "3.12"
      - run: pip install requests tzdata pillow
      - run: python badminton_brno.py --export site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5      # Node 24
